# Run Taskboard with PostgreSQL, as in production (book Chapters 16 and 30).
#   docker compose up --build        then open http://localhost:8000
# No Docker? Use the default SQLite route in the README instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard   # local development only; never reuse in production
      POSTGRES_DB: taskboard
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard"]
      interval: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://taskboard:taskboard@db:5432/taskboard
      APP_ENV: development
      APP_URL: http://localhost:8000
      EMAIL_MODE: console
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
