[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # third-party: Starlette's test client asks for a newer HTTP client package; see docs/debt.md
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # third-party: older Starlette test clients use an alias newer AnyIO versions deprecate
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
